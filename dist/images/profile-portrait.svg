<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0C0C10"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="38%" r="48%" fx="50%" fy="38%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="150" y1="420" x2="450" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272F"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
    <linearGradient id="lapelGrad" x1="200" y1="440" x2="400" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#383844"/>
      <stop offset="100%" stop-color="#16161C"/>
    </linearGradient>
    <linearGradient id="skinLit" x1="220" y1="160" x2="380" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F4F6"/>
      <stop offset="55%" stop-color="#D4D4DC"/>
      <stop offset="100%" stop-color="#8E8E9E"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="200" y1="110" x2="400" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#272730"/>
      <stop offset="100%" stop-color="#09090C"/>
    </linearGradient>
    <linearGradient id="accentStroke" x1="0" y1="0" x2="600" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FAFAFA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="600" height="720" fill="url(#bgGrad)"/>
  <rect width="600" height="720" fill="url(#archGrid)"/>
  <circle cx="300" cy="285" r="260" fill="url(#haloGlow)"/>

  <!-- Architectural Orbit Rings -->
  <circle cx="300" cy="285" r="210" stroke="url(#accentStroke)" stroke-width="1" stroke-dasharray="6 8" opacity="0.45"/>
  <circle cx="300" cy="285" r="165" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Crosshair Technical Marks -->
  <g stroke="#71717A" stroke-width="1" opacity="0.6">
    <path d="M40 50 H65 M52.5 37.5 V62.5"/>
    <path d="M535 50 H560 M547.5 37.5 V62.5"/>
    <path d="M40 670 H65 M52.5 657.5 V682.5"/>
    <path d="M535 670 H560 M547.5 657.5 V682.5"/>
  </g>

  <!-- Technical Spec Labels -->
  <text x="40" y="92" fill="#71717A" font-family="monospace" font-size="11" letter-spacing="2">PORTRAIT // STUDIO.01</text>
  <text x="435" y="92" fill="#6366F1" font-family="monospace" font-size="11" letter-spacing="2">ISO 100 • F/1.4</text>

  <!-- Shoulders & Modern Minimalist Blazer / Crewneck -->
  <path d="M95 720 C102 555, 168 478, 238 456 L300 475 L362 456 C432 478, 498 555, 505 720 Z" fill="url(#suitGrad)" stroke="#3F3F46" stroke-width="1.5"/>

  <!-- Inner White Crewneck Tee Collar -->
  <path d="M248 462 Q300 508 352 462 L338 565 Q300 585 262 565 Z" fill="#E4E4E7"/>
  <!-- Dark Minimalist Jacket Lapels -->
  <path d="M236 455 L278 605 L210 615 L185 485 Z" fill="url(#lapelGrad)" stroke="#52525B" stroke-width="1"/>
  <path d="M364 455 L322 605 L390 615 L415 485 Z" fill="url(#lapelGrad)" stroke="#52525B" stroke-width="1"/>

  <!-- Subtle Rim Light on Shoulders -->
  <path d="M100 710 C108 555, 170 480, 238 456" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M500 710 C492 555, 430 480, 362 456" stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Neck & Shadow -->
  <path d="M256 375 L256 466 Q300 492 344 466 L344 375 Z" fill="#A1A1B0"/>
  <path d="M256 385 Q300 432 344 385 L344 425 Q300 458 256 425 Z" fill="#525260" opacity="0.65"/>

  <!-- Ears -->
  <rect x="196" y="262" width="22" height="54" rx="11" fill="#B4B4C2"/>
  <rect x="382" y="262" width="22" height="54" rx="11" fill="#9E9EAE"/>

  <!-- Head / Face Structure -->
  <path d="M210 225 C210 158, 390 158, 390 225 C390 305, 376 368, 336 402 C314 418, 286 418, 264 402 C224 368, 210 305, 210 225 Z" fill="url(#skinLit)"/>

  <!-- Facial Dimension Shading -->
  <path d="M300 175 C355 175, 390 205, 390 225 C390 305, 376 368, 336 402 C318 415, 300 416, 300 416 Z" fill="#18181B" opacity="0.14"/>

  <!-- Modern Textured Hair -->
  <path d="M198 242 C192 182, 222 126, 296 122 C368 118, 412 165, 402 238 C396 205, 382 184, 355 176 C328 168, 295 186, 260 184 C230 182, 212 204, 206 242 Z" fill="url(#hairGrad)"/>
  <path d="M218 158 C248 130, 315 125, 362 152" stroke="#6366F1" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Eyebrows -->
  <path d="M236 246 Q262 238 284 246" stroke="#27272A" stroke-width="5" stroke-linecap="round"/>
  <path d="M316 246 Q338 238 364 246" stroke="#27272A" stroke-width="5" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="262" cy="268" rx="11" ry="7" fill="#18181B"/>
  <circle cx="265" cy="266" r="2.5" fill="#FAFAFA"/>
  <ellipse cx="338" cy="268" rx="11" ry="7" fill="#18181B"/>
  <circle cx="341" cy="266" r="2.5" fill="#FAFAFA"/>

  <!-- Signature Developer Eyewear (Sleek Titanium Frames) -->
  <rect x="226" y="248" width="68" height="44" rx="10" fill="#6366F1" fill-opacity="0.08" stroke="#FAFAFA" stroke-width="2.5"/>
  <rect x="306" y="248" width="68" height="44" rx="10" fill="#6366F1" fill-opacity="0.08" stroke="#FAFAFA" stroke-width="2.5"/>
  <path d="M294 264 H306" stroke="#FAFAFA" stroke-width="2.5"/>
  <path d="M210 262 L226 260" stroke="#A1A1AA" stroke-width="2"/>
  <path d="M374 260 L390 262" stroke="#A1A1AA" stroke-width="2"/>
  <!-- Eyeglass Lens Reflection -->
  <path d="M236 254 L252 286" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <path d="M316 254 L332 286" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- Nose & Confident Subtle Smile -->
  <path d="M300 268 L294 316 L308 320" stroke="#71717A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M276 348 Q300 362 324 348" stroke="#3F3F46" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M290 362 Q300 366 310 362" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating Glassmorphic Code & Telemetry Overlay Bottom -->
  <rect x="36" y="596" width="528" height="88" rx="14" fill="#09090B" fill-opacity="0.82" stroke="#27272A" stroke-width="1"/>
  <circle cx="68" cy="640" r="6" fill="#10B981"/>
  <circle cx="68" cy="640" r="12" stroke="#10B981" stroke-opacity="0.35" stroke-width="2"/>
  <text x="92" y="633" fill="#FAFAFA" font-family="sans-serif" font-weight="700" font-size="15" letter-spacing="0.5">BAGUS SETYO NUGROHO</text>
  <text x="92" y="655" fill="#A1A1AA" font-family="monospace" font-size="11.5">INFORMATICS STUDENT @ UISI // ASPIRING DEV</text>
  <rect x="434" y="622" width="106" height="34" rx="8" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.4"/>
  <text x="448" y="644" fill="#818CF8" font-family="monospace" font-weight="600" font-size="12">UISI • SEM 5</text>
</svg>
